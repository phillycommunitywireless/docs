site_name: Philly Community Wireless Docs
site_url: https://docs.phillycommunitywireless.org

theme:
  name: material
  language: en
  logo: assets/icons/logo.svg
  favicon: assets/icons/favicon/favicon.ico
  custom_dir: overrides
  features:
    - navigation.tracking
    - navigation.sections
    - content.tooltips
  palette:
    - scheme: default
      media: "(prefers-color-scheme: light)"
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      media: "(prefers-color-scheme: dark)"
      primary: black
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

hooks:
  - hooks/hide_empty_pages.py
  - hooks/glossary_tooltips.py

plugins:
  - search
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: es
          name: Español
          build: true
          nav_translations:
            Home: Inicio
            Installations: Instalaciones
            Installation Overview: Descripción general
            Building Assessment: Evaluación del edificio
            Hardware: Hardware
            Solar: Solar
            Solar Mesh Nodes: Nodos solares
            Access Point Placement: Ubicación de los puntos de acceso
            Green Technology Resources: Recursos de tecnología verde
            Networking and Device Configuration: Redes y configuración de dispositivos
            Wireless: Inalámbrico
            Software and Cloud Infrastructure: Software e infraestructura en la nube
            Set a Static IP Address: Configurar una IP estática
            Configure EdgeRouter X: Configurar EdgeRouter X
            Configure Unifi APs: Configurar APs Unifi
            Configure IoT Devices: Configurar dispositivos IoT
            Troubleshoot Devices: Solución de problemas
            Resources: Recursos
            Glossary: Glosario
            Further reading: Más recursos

nav:
  - Home: index.md
  
  - For Antenna Hosts:
    - Installation Overview: installations/installations.md
    - Building Assessments: installations/buildingassessment.md

  - For Volunteers:
    - Installations:
      - Install & Maintenance Handbook:
        - Overview: installations/handbook/overview.md
        - Etiquette On Site: installations/handbook/etiquette.md
        - Safety Basics: installations/handbook/safety-basics.md
        - Weather & Environmental Risks: installations/handbook/risks-weather-environment.md
        - Rooftop, Ladder & Drill Safety: installations/handbook/risks-rooftop-ladder-drill.md
        - Building & Electrical Safety: installations/handbook/safety-buildings-electrical.md
        - Install Phases Overview: installations/handbook/phases-overview.md
        - Building Assessment & Planning: installations/handbook/assessment-planning.md
        - Install Day & Maintenance: installations/handbook/install-day-and-maintenance.md
      - Access Point Placement: installations/ap-placement.md
      - Hardware: installations/hardware.md
    - Networking and Device Configuration:
        - Set a Static IP Address: device-configuration/configure-computer.md
        - Configure routers running EdgeOS:
          - Manual configuration: device-configuration/configure-edgerouter-x.md
          - Automated configuration with Ansible: device-configuration/configure-edgerouter-ansible.md
        - Configure Unifi APs: device-configuration/configure-ap-mesh.md
        - Wireless settings: device-configuration/wireless-settings.md
        - Troubleshoot Unifi Devices: device-configuration/troubleshoot-devices.md
        - Network Monitoring:
          - Unpoller: device-configuration/unpoller.md
        - Useful Software: device-configuration/useful-software.md
    - Solar:
      - Solar Mesh Nodes: installations/solar.md
      - Green Technology Resources: installations/green-technology.md
    - Wireless:
      - Fixed Wireless: wireless/fixed-wireless.md
      - WiFi: wireless/wifi.md
    - Software and Cloud Infrastructure:
      - Overview: software-infrastructure/overview.md

  - For network users: 
    - Troubleshoot your connection: device-configuration/troubleshoot-connection.md
    - Configure IoT Devices: device-configuration/configure-IoT.md
    - FAQs: faqs.md

  - Resources:
    - Glossary: glossary.md
    - Further reading: resources.md

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - tables
  - abbr
  - def_list
  - admonition
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
