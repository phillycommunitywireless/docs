site_name: Philly Community Wireless Docs
site_url: https://docs.phillycommunitywireless.org

theme:
  name: material
  language: en
  logo: assets/icons/logo.svg
  favicon: assets/icons/favicon/favicon.ico
  custom_dir: overrides
  features:
    - navigation.tracking
    - navigation.sections
    - content.tooltips
  palette:
    - scheme: default
      media: "(prefers-color-scheme: light)"
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      media: "(prefers-color-scheme: dark)"
      primary: black
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

hooks:
  - hooks/glossary_tooltips.py

# Draft pages still being worked on.
# Built with `mkdocs serve` for dev. purposes, but excluded from prod builds with `mkdocs build`
# Each line starts with `/*/` so it matches the page in every language folder (en/, es/).
# When a page is ready, delete its line here and add it to `nav:` below in the proper place.
# mkdocs.dev.yml's nav already lists it, so leave that file as is.
draft_docs: |
  /*/faqs.md
  /*/device-configuration/configure-edgerouter-ansible.md
  /*/device-configuration/troubleshoot-connection.md
  /*/device-configuration/unpoller.md
  /*/device-configuration/useful-software.md
  /*/device-configuration/wireless-settings.md
  /*/installations/handbook/assessment-planning.md
  /*/installations/handbook/etiquette.md
  /*/installations/handbook/install-day-and-maintenance.md
  /*/installations/handbook/overview.md
  /*/installations/handbook/phases-overview.md
  /*/installations/handbook/risks-rooftop-ladder-drill.md
  /*/installations/handbook/risks-weather-environment.md
  /*/installations/handbook/safety-basics.md
  /*/installations/handbook/safety-buildings-electrical.md
  /*/software-infrastructure/overview.md
  /*/wireless/fixed-wireless.md
  /*/wireless/wifi.md

plugins:
  - search
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: es
          name: Español
          build: true
          nav_translations:
            # TODO: Spanish review of the nav labels added below — for a fluent speaker at PR review.
            Home: Inicio
            For Antenna Hosts: Para anfitriones de antena
            For Volunteers: Para voluntarios
            For network users: Para usuarios de la red
            Installations: Instalaciones
            Installation Overview: Descripción general de la instalación
            Building Assessment: Evaluación del edificio
            Building Assessments: Evaluación del edificio
            Configure routers running EdgeOS: Configurar routers con EdgeOS
            Manual configuration: Configuración manual
            Troubleshoot Unifi Devices: Solución de problemas de dispositivos Unifi
            Hardware: Hardware
            Solar: Solar
            Solar Mesh Nodes: Nodos solares de malla
            Access Point Placement: Ubicación de los puntos de acceso
            Green Technology Resources: Recursos de tecnología verde
            Networking and Device Configuration: Redes y configuración de dispositivos
            Set a Static IP Address: Configurar una IP estática
            Configure EdgeRouter X: Configurar EdgeRouter X
            Configure Unifi APs: Configurar APs Unifi
            Configure IoT Devices: Configurar dispositivos IoT
            Connecting to the network: Conectarse a la red
            Troubleshoot Devices: Solución de problemas de dispositivos
            Resources: Recursos
            Glossary: Glosario
            Further reading: Lecturas adicionales
            # Labels only in mkdocs.dev.yml's nav, for draft pages.
            Overview: Descripción general
            Install Phases Overview: Fases de instalación
            Assessment & Planning: Evaluación y planificación
            Etiquette On Site: Normas de conducta en el sitio
            Install Day & Maintenance: Día de instalación y mantenimiento
            Safety: Seguridad
            Safety Basics: Seguridad básica
            Building & Electrical Safety: Seguridad en edificios y eléctrica
            "Rooftop, Ladder & Drill Safety": Seguridad en azoteas, escaleras y taladros
            Weather & Environmental Risks: Riesgos climáticos y ambientales
            Wireless: Inalámbrico
            Fixed Wireless: Inalámbrico fijo
            WiFi: Wifi
            Automated configuration (Ansible): Configuración automatizada (Ansible)
            Troubleshoot Your Connection: Solución de problemas de su conexión
            Wireless Settings: Configuración inalámbrica
            Useful Software: Software útil
            Unpoller: Unpoller
            Software & Infrastructure: Software e infraestructura
            FAQs: Preguntas frecuentes

nav:
  - Home: index.md
  
  - For Antenna Hosts:
    - Installation Overview: installations/installations.md

  - For Volunteers:
    - Installations:
      - Building Assessments: installations/buildingassessment.md
      - Access Point Placement: installations/ap-placement.md
      - Hardware: installations/hardware.md
    - Networking and Device Configuration:
        - Set a Static IP Address: device-configuration/configure-computer.md
        - Configure routers running EdgeOS:
          - Manual configuration: device-configuration/configure-edgerouter-x.md
        - Configure Unifi APs: device-configuration/configure-ap-mesh.md
        - Troubleshoot Unifi Devices: device-configuration/troubleshoot-devices.md
    - Solar:
      - Solar Mesh Nodes: installations/solar.md
      - Green Technology Resources: installations/green-technology.md

  - For network users:
    - Connecting to the network: for-network-users/connect-to-the-network.md
    - Configure IoT Devices: for-network-users/configure-IoT.md

  - Resources:
    - Glossary: glossary.md
    - Further reading: resources.md

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - tables
  - abbr
  - def_list
  - admonition
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences

# Report links to headings that don't exist (`page.md#missing-heading`), so
# `mkdocs build --strict` fails on them like it does on links to missing pages.
validation:
  anchors: warn
