site_name: Philly Community Wireless Docs
site_url: https://docs.phillycommunitywireless.org

theme:
  name: material
  language: en
  logo: assets/icons/logo.svg
  favicon: assets/icons/favicon/favicon.ico
  custom_dir: overrides
  features:
    - navigation.tracking
    - navigation.sections
    - content.tooltips
  palette:
    - scheme: default
      media: "(prefers-color-scheme: light)"
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      media: "(prefers-color-scheme: dark)"
      primary: black
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

hooks:
  - hooks/glossary_tooltips.py

# Draft pages still being worked on.
# Built with `mkdocs serve` for dev. purposes, but excluded from prod builds with `mkdocs build`
# When a page is ready, delete its line here, add it to `nav:` below in the proper place, and
# remove its entry from mkdocs.dev.yml's nav 
draft_docs: |
  /en/faqs.md
  /en/device-configuration/configure-edgerouter-ansible.md
  /en/device-configuration/troubleshoot-connection.md
  /en/device-configuration/unpoller.md
  /en/device-configuration/useful-software.md
  /en/device-configuration/wireless-settings.md
  /en/software-infrastructure/overview.md
  /en/wireless/fixed-wireless.md
  /en/wireless/wifi.md

plugins:
  - search
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: es
          name: Español
          build: true
          nav_translations:
            # TODO: Spanish review of the nav labels added below — for a fluent speaker at PR review.
            Home: Inicio
            For Antenna Hosts: Para anfitriones de antenas
            For Volunteers: Para voluntarios
            For network users: Para usuarios de la red
            Installations: Instalaciones
            Installation Overview: Descripción general
            Configure routers running EdgeOS: Configurar routers con EdgeOS
            Manual configuration: Configuración manual
            Troubleshoot Unifi Devices: Solución de problemas de dispositivos Unifi
            Hardware: Hardware
            Solar: Solar
            Solar Mesh Nodes: Nodos solares
            Green Technology Resources: Recursos de tecnología verde
            Networking and Device Configuration: Redes y configuración de dispositivos
            Set a Static IP Address: Configurar una IP estática
            Configure EdgeRouter X: Configurar EdgeRouter X
            Configure Unifi APs: Configurar APs Unifi
            Configure IoT Devices: Configurar dispositivos IoT
            Connecting to the network: Conectarse a la red
            Troubleshoot Devices: Solución de problemas
            Resources: Recursos
            Glossary: Glosario
            Further reading: Más recursos

nav:
  - Home: index.md
  
  - For Antenna Hosts:
    - Installation Overview: installations/installations.md

  - For Volunteers:
    - Installations:
      - Guiding Principles: installations/handbook/overview.md
      - Safety:
        - Safety Basics: installations/handbook/safety-basics.md
        - Rooftop, Ladder & Drill Safety: installations/handbook/risks-rooftop-ladder-drill.md
        - Building & Electrical Safety: installations/handbook/safety-buildings-electrical.md
      - Install Planning: installations/install-planning.md
      - Hardware and Cabling:
        - Hardware: installations/hardware.md
        - Cabling and Mounting: installations/cabling-and-mounting.md
    - Networking and Device Configuration:
        - Set a Static IP Address: device-configuration/configure-computer.md
        - Configure routers running EdgeOS:
          - Manual configuration: device-configuration/configure-edgerouter-x.md
        - Configure Unifi APs: device-configuration/configure-ap-mesh.md
        - Troubleshoot Unifi Devices: device-configuration/troubleshoot-devices.md
    - Solar:
      - Solar Mesh Nodes: installations/solar.md
      - Green Technology Resources: installations/green-technology.md

  - For network users:
    - Connecting to the network: for-network-users/connect-to-the-network.md
    - Configure IoT Devices: for-network-users/configure-IoT.md

  - Resources:
    - Glossary: glossary.md
    - Further reading: resources.md

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - tables
  - abbr
  - def_list
  - admonition
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
